[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "uniselecciones-api"
version = "0.1.0"
description = "API REST de UniSelecciones"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "argon2-cffi>=23.1,<26",
    "fastapi>=0.115,<1.0",
    "psycopg[binary]>=3.2,<4",
    "PyJWT>=2.9,<3",
    "python-dotenv>=1.0,<2",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.11,<1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
